name: Earnings Edge — Daily Scans

# Scheduled earnings scans + heartbeats. GitHub Actions cron is UTC-only and
# ignores US daylight saving, so we fire at every candidate UTC time and let
# scripts/dispatch.py decide which stage (if any) runs based on the current
# America/New_York time. Exactly one ET target matches per fire.
#
# ET windows -> UTC candidates (EDT / EST):
#   07:00 ET morning_scan        11:00 / 12:00 UTC
#   09:30 ET market_open_check   13:30 / 14:30 UTC
#   16:30 ET post_market_update  20:30 / 21:30 UTC
#   18:00 ET grader              22:00 / 23:00 UTC

on:
  schedule:
    # Each stage lists an extra catch-up hour: GitHub's scheduler is
    # best-effort and sometimes drops a fire outright (observed Mon Jul 6).
    # Persistent per-day idempotency in dispatch.py makes extra fires no-ops
    # when an earlier one already ran.
    - cron: "0 11,12,13 * * 1-5"    # morning_scan (+13:00 catch-up)
    - cron: "30 13,14,15 * * 1-5"   # market_open_check (+15:30 catch-up)
    - cron: "30 20,21,22 * * 1-5"   # post_market_update (+22:30 catch-up)
    - cron: "0 22,23 * * 1-5"       # grader
  workflow_dispatch:
    inputs:
      stage:
        description: "Force a stage (morning | open | post | grade). Leave blank to auto-pick by ET time."
        required: false
        default: ""

concurrency:
  group: earnings-edge-daily
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      UNUSUAL_WHALES_API_KEY: ${{ secrets.UNUSUAL_WHALES_API_KEY }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Runners are ephemeral; the SQLite DB (picks, grades, IV history,
      # run-log idempotency) must survive between runs. Restore the most
      # recent cache and save under a fresh key each run (cache keys are
      # immutable, so a per-run key + prefix restore is the standard pattern
      # for an evolving file).
      - name: Restore picks database
        uses: actions/cache/restore@v4
        with:
          path: data/picks.db
          key: picks-db-${{ github.run_id }}
          restore-keys: |
            picks-db-

      - name: Run stage
        # Key off which cron fired (github.event.schedule) — GitHub delays
        # scheduled runs by hours, so wall-clock time is unreliable. For manual
        # runs, github.event.inputs.stage forces a specific stage.
        run: >
          python scripts/dispatch.py
          --schedule "${{ github.event.schedule }}"
          --stage "${{ github.event.inputs.stage }}"

      - name: Save picks database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/picks.db
          key: picks-db-${{ github.run_id }}
